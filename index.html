<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Doces Flor de Maracujá</title>
</head>
<body>
   <!-- HEADER-->
    <header>
        <nav class="navbar">
         <img src="src/images/logo-docesflor-demaracuja.PNG" 
         alt="Logo Flor de Maracujá"
         class="logo"
         >

         <!-- botão hambúrguer, só aparece no mobile (escondido via CSS acima de 769px) -->
         <button class="btn btn-mobile">
            <i class="fa-solid fa-bars"></i> <!-- ícone inicial: hambúrguer (menu fechado) -->
         </button>

         <!-- lista de links do menu. SEM classe "show" -> começa escondida no mobile (ver navbar.css) -->
          <ul id="nav-links">
            <li>
                <a href="#home">Home</a>
            </li>
            <li>
                <a href="#trending">Em alta</a>
            </li>
            <li>
                <a href="#about">Sobre nós</a>
            </li>
            <li>
                <a href="#products">Novidades</a>
            </li>
          </ul>

          <!-- botão de contato via WhatsApp (link com mensagem pré-preenchida na URL) -->
          <a href="https://wa.me/5581998300838?text=Ol%C3%A1!%20Gostaria%20de%20tirar%20uma%20d%C3%BAvida%20sobre%20a%20Doces%20Flor%20de%20Maracuj%C3%A1%E2%98%BA%EF%B8%8F" 
          class="btn btn-default">
          Contatar
          </a>

        </nav>
    </header>

   <!--MAIN-->
    <main id="container">
        <!-- HOME -->
         <section id="home">
            <img src="src/images/kitdoces.PNG" 
            alt="Encomende o seu kit"
            class="home-image">
            <h1 class="home-title">
            Cuidando de cada detalhe, 
            <span> do TOPO ao RECHEIO.</span> <!-- span separado para aplicar cor diferente via CSS -->
            </h1>
            <p class="home-description">
                Descubra bolos icônicos, sentimentos mágicos
                e a energia perfeita para cada parte do seu dia.
            </p>

            <div class="home-actions">
               <a href="#" class="btn btn-default">
                    Conhecer
                </a>
               <a href="#" class="btn btn-outlined">
                    Contatar
                </a>
            </div>

         </section>
    </main>
    <script src="src/js/script.js"></script> <!-- carregado no fim do body para não bloquear a renderização da página -->
</body>
</html>
